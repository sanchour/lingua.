<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <!-- Only the safe parts of a policy (no plugins, no changed base address): scripts and connections are not limited, because the app talks to many services (AI keys, Commons, YouTube, sync) and GitHub Pages cannot send a report-only header to find them first. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A calm, local-first studio for reading, vocabulary, listening and watching in a new language." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lingua" />
    <meta name="format-detection" content="telephone=no" />
    <title>Lingua</title>
    <script>
      // Resolve the theme before first paint (no flash). The saved choice lives in IndexedDB;
      // this localStorage copy is only a startup hint and may be missing.
      (function () {
        var pref = 'paper';
        try { pref = localStorage.getItem('lingua.theme') || 'paper'; } catch (e) {}
        var dark = pref === 'nocturne' ||
          (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'nocturne' : 'paper';
        document.documentElement.setAttribute('data-theme', theme);
        // The chosen look within the theme; its colours arrive with the app's stylesheet.
        try { document.documentElement.setAttribute('data-palette', JSON.parse(localStorage.getItem('lingua.palette') || '{}')[theme] || ''); } catch (e) {}
        // The Home Screen icon follows the phone's appearance when Lingua is added (iOS reads it then).
        var systemDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.write('<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon' + (systemDark ? '-dark' : '') + '-180x180.png">');
        // iOS reads the status-bar style once at launch, so it is written while the head is parsed.
        document.write(
          '<meta name="theme-color" content="' + (dark ? '#1F1C1A' : '#FAF6F0') + '">' +
          '<meta name="apple-mobile-web-app-status-bar-style" content="' + (dark ? 'black-translucent' : 'default') + '">'
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app draws (React replaces it), so a slow start or an update never looks like a blank page. -->
      <style>
        #boot { min-height: 100vh; display: grid; place-items: center; font: 600 28px/1.2 Georgia, serif; color: #2b2522; background: #faf6f0; }
        [data-theme='nocturne'] #boot { color: #efe7df; background: #1f1c1a; }
        #boot span { opacity: 0.55; animation: boot 1.6s ease-in-out infinite alternate; }
        #boot p { display: none; margin: 14px 0 0; font: 400 14px/1.5 system-ui, sans-serif; text-align: center; opacity: 0.7; }
        #boot.slow p { display: block; }
        #boot-error { font-family: ui-monospace, monospace !important; font-size: 12px !important; max-width: 560px; overflow-wrap: anywhere; }
        #boot button { font: inherit; text-decoration: underline; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }
        @keyframes boot { to { opacity: 1; } }
      </style>
      <div id="boot">
        <div>
          <span>Lingua</span>
          <p>Taking longer than usual. <button type="button" onclick="location.reload()">Reload</button> · <button type="button" onclick="lingaFresh()">Clear the cached app and reload</button></p>
          <p id="boot-error"></p>
        </div>
      </div>
      <script>
        // Until the app draws: after 15 seconds offer a reload, and a fresh copy of the app (the cached files and the
        // service worker go; learning data in IndexedDB stays). An error before the first draw is shown, not hidden.
        function lingaFresh() {
          var done = function () { location.reload(); };
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(done, done);
        }
        setTimeout(function () { var b = document.getElementById('boot'); if (b) b.className = 'slow'; }, 15000);
        function bootError(message) {
          var b = document.getElementById('boot');
          var e = document.getElementById('boot-error');
          if (!b || !e || !message) return;
          b.className = 'slow';
          e.textContent = 'Lingua couldn’t start: ' + message;
        }
        window.addEventListener('error', function (e) { bootError(e.message || (e.target && e.target.tagName === 'SCRIPT' ? 'couldn’t load ' + e.target.src : '')); }, true);
        window.addEventListener('unhandledrejection', function (e) { bootError(String((e.reason && e.reason.message) || e.reason)); });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
